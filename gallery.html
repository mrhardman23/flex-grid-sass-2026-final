    <title>Photo Grid | Advanced CSS</title>

    <style>
      #gallery {
        display: grid;
        /* grid-template-rows: repeat(4, minmax(500px, 1fr)); */
        grid-template-columns: 40fr 7fr 40fr;
        grid-template-rows: repeat(8, 1fr);
        grid-template-areas:
          "robot-cyber-laptop programming-multi-screen programming-multi-screen"
          "robot-cyber-laptop cybersecurity cybersecurity"
          "hacker hacker white-pc"
          "programming-languages programming-languages white-pc"
          "asus-motherboard operating-system operating-system"
          "asus-motherboard data-center data-center"
          "vpn vpn python-code"
          "computer-repair-skills computer-repair-skills python-code";

        /* gap: 0.2% 1%; */

        width: 75%;
        height: 75%;

        margin: 0 auto;
      }

      #gallery a {
        display: flex;

        width: 100%;
        height: 100%;
      }

      #gallery a img {
        display: inline-block;
        width: 100%;
      }

      #robot-cyber-laptop {
        grid-area: robot-cyber-laptop;
      }

      #programming-multi-screen {
        grid-area: programming-multi-screen;
      }

      #cybersecurity {
        grid-area: cybersecurity;
      }

      #hacker {
        grid-area: hacker;
      }

      #programming-languages {
        grid-area: programming-languages;
      }

      #white-pc {
        grid-area: white-pc;
      }

      #asus-motherboard {
        grid-area: asus-motherboard;
      }

      #operating-system {
        grid-area: operating-system;
      }

      #data-center {
        grid-area: data-center;
      }

      #vpn {
        grid-area: vpn;
      }

      #computer-repair-skills {
        grid-area: computer-repair-skills;
      }

      #python-code {
        grid-area: python-code;
      }
    </style>
  </head>
